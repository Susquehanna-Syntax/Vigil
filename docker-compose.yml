# Vigil — Self-hosted infrastructure monitoring & endpoint management
# https://github.com/susquehannasyntax/vigil
#
# Paste this into Portainer → Stacks → Add Stack, or run:
#   docker compose up -d
#
# Required environment variables (set in Portainer's "Environment variables" tab
# or in a .env file alongside this compose — NOT inline in this YAML):
#
#   DJANGO_SECRET_KEY      — random secret, e.g. openssl rand -hex 32
#   VIGIL_SIGNING_KEY_SEED — Ed25519 seed for task signing
#                            generate: python3 -c "import os,base64; print(base64.b64encode(os.urandom(32)).decode())"
#                            value MUST be exactly 44 chars ending in '=' (32-byte base64)
#                            PORTAINER/YAML TRAP: the trailing '=' is base64 padding and gets
#                            stripped by some YAML parsers — keep it in env vars or quote it
#                            ("Hk3...P0c="). A malformed seed throws binascii.Error and 500s
#                            every agent checkin.
#   POSTGRES_PASSWORD      — database password. If you do not set it, it is
#                            literally 'vigil' — the same guess as the user
#                            and the database name, on every Vigil install
#                            in existence. Postgres is not published to the
#                            host here, but every other container on this
#                            Docker host can reach db:5432. Set it.
#
# Optional:
#   POSTGRES_DB            — default: vigil
#   POSTGRES_USER          — default: vigil
#   VIGIL_TIMEZONE         — IANA tz name, e.g. America/New_York (default: UTC)
#   VIGIL_GUACD_ADDR=guacd:4822  — set with --profile rdp to turn on Web RDP
#
# No longer used:
#   VIGIL_AGENT_VERSION    — ignored. The expected agent version is detected
#                            from the agent bundled in the image. Leaving it in
#                            .env is harmless; the server logs a note at
#                            startup if it is still set.
#
# Verify after deploy:
#   docker exec <web-container> python -c \
#     "import os,base64; s=os.environ['VIGIL_SIGNING_KEY_SEED']; print(len(s), len(base64.b64decode(s)))"
#   # Expect: 44 32

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vigil}
      POSTGRES_USER: ${POSTGRES_USER:-vigil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigil}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigil}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: susquehannasyntax/vigil:latest
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is not set — see the header of this file for how to generate one}"
      VIGIL_SIGNING_KEY_SEED: ${VIGIL_SIGNING_KEY_SEED:-}
      VIGIL_TIMEZONE: ${VIGIL_TIMEZONE:-UTC}
      VIGIL_METRIC_RETENTION_DAYS: ${VIGIL_METRIC_RETENTION_DAYS:-30}
      VIGIL_ALERT_RETENTION_DAYS: ${VIGIL_ALERT_RETENTION_DAYS:-90}
      # Remote access (see docs/REMOTE-ACCESS.md). Set VIGIL_PUBLIC_URL to your
      # external URL and VIGIL_TRUST_PROXY=true when serving through Cloudflare
      # Tunnel / Tailscale / a reverse proxy. Both default to off (LAN-only).
      VIGIL_PUBLIC_URL: ${VIGIL_PUBLIC_URL:-}
      VIGIL_TRUST_PROXY: ${VIGIL_TRUST_PROXY:-false}
      VIGIL_SECURE_COOKIES: ${VIGIL_SECURE_COOKIES:-false}
      # Both are also derived from VIGIL_PUBLIC_URL; set them explicitly when
      # Vigil answers on more than one name. Without the passthrough they sit
      # unread in .env and the container never sees them — which is why
      # setting DJANGO_CSRF_TRUSTED_ORIGINS alone appeared to do nothing.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      POSTGRES_DB: ${POSTGRES_DB:-vigil}
      POSTGRES_USER: ${POSTGRES_USER:-vigil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigil}
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Web RDP (QA-59). An empty address keeps the feature off and the Connect
      # menu says so; run with --profile rdp and set VIGIL_GUACD_ADDR=guacd:4822
      # to turn a Windows host's desktop into a browser tab.
      VIGIL_GUACD_ADDR: ${VIGIL_GUACD_ADDR:-}
      # The name guacd uses to reach this container for its RDP connection back.
      # Never the target's address: that stays on the agent's side of the bus.
      VIGIL_RDP_BRIDGE_HOST: web
    ports:
      - "9200:8000"
    # Without this Docker can only see whether the process exited, never
    # whether gunicorn is up but wedged — and every `condition: service_healthy`
    # in this file could only ever wait on db and redis, so the workers came up
    # "healthy" and dispatched into a server that would not answer.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media
      # guacd writes an RDP recording here and Vigil reads it back; the same
      # named volume is mounted in both containers, on different paths.
      - rdp-recordings:/app/media/recordings/rdp
      # Extracted OS install trees for reprovisioning. Shared with the
      # worker: the worker imports, the web container serves to installers.
      - images:/var/lib/vigil/images

  guacd:
    # Apache Guacamole's RDP speaker. Vigil hands it a one-shot port back to
    # the agent and relays its instructions to the browser; nothing here
    # publishes a port, because only this container's peer is the web one.
    image: guacamole/guacd:1.5.5
    restart: unless-stopped
    profiles: ["rdp"]
    volumes:
      - rdp-recordings:/recordings

  celery-worker:
    image: susquehannasyntax/vigil:latest
    restart: unless-stopped
    command: celery -A vigil worker -l info
    healthcheck:
      test: ["CMD-SHELL", "celery -A vigil inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is not set — see the header of this file for how to generate one}"
      VIGIL_SIGNING_KEY_SEED: ${VIGIL_SIGNING_KEY_SEED:-}
      POSTGRES_DB: ${POSTGRES_DB:-vigil}
      POSTGRES_USER: ${POSTGRES_USER:-vigil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigil}
      # The pruning beats run here, so these must reach the worker
      # and not only the web container — documented settings that
      # were never passed through are settings that do nothing.
      VIGIL_METRIC_RETENTION_DAYS: ${VIGIL_METRIC_RETENTION_DAYS:-30}
      VIGIL_ALERT_RETENTION_DAYS: ${VIGIL_ALERT_RETENTION_DAYS:-90}
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # The worker runs the ISO import that writes these trees; the web
      # container serves them to installers. Both need the same volume.
      - images:/var/lib/vigil/images

  celery-beat:
    image: susquehannasyntax/vigil:latest
    restart: unless-stopped
    command: celery -A vigil beat -l info --pidfile=/tmp/celerybeat.pid --scheduler django_celery_beat.schedulers:DatabaseScheduler
    # beat has no inspect interface — it schedules, it does not consume. The
    # pid file it maintains is the honest liveness signal available.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is not set — see the header of this file for how to generate one}"
      VIGIL_SIGNING_KEY_SEED: ${VIGIL_SIGNING_KEY_SEED:-}
      POSTGRES_DB: ${POSTGRES_DB:-vigil}
      POSTGRES_USER: ${POSTGRES_USER:-vigil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigil}
      # The pruning beats run here, so these must reach the worker
      # and not only the web container — documented settings that
      # were never passed through are settings that do nothing.
      VIGIL_METRIC_RETENTION_DAYS: ${VIGIL_METRIC_RETENTION_DAYS:-30}
      VIGIL_ALERT_RETENTION_DAYS: ${VIGIL_ALERT_RETENTION_DAYS:-90}
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Cloudflare Tunnel sidecar — opt-in. Publishes Vigil to a public hostname
  # without opening any inbound port on your network. Enable with:
  #   docker compose --profile tunnel up -d
  # after creating a tunnel in the Cloudflare Zero Trust dashboard and setting
  # TUNNEL_TOKEN (and VIGIL_PUBLIC_URL + VIGIL_TRUST_PROXY=true). Point the
  # tunnel's public hostname at http://web:8000. See docs/REMOTE-ACCESS.md.
  # Keeps the outbound link to each relay (Settings → Relays). Idle with none.
  link:
    image: susquehannasyntax/vigil:latest
    restart: unless-stopped
    command: python manage.py relay_link
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is not set — see the header of this file for how to generate one}"
      VIGIL_SIGNING_KEY_SEED: ${VIGIL_SIGNING_KEY_SEED:-}
      POSTGRES_DB: ${POSTGRES_DB:-vigil}
      POSTGRES_USER: ${POSTGRES_USER:-vigil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigil}
      # The pruning beats run here, so these must reach the worker
      # and not only the web container — documented settings that
      # were never passed through are settings that do nothing.
      VIGIL_METRIC_RETENTION_DAYS: ${VIGIL_METRIC_RETENTION_DAYS:-30}
      VIGIL_ALERT_RETENTION_DAYS: ${VIGIL_ALERT_RETENTION_DAYS:-90}
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      VIGIL_PUBLIC_URL: ${VIGIL_PUBLIC_URL:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      VIGIL_LINK_UPSTREAM: http://web:8000
      VIGIL_LINK_HOST: localhost
    depends_on:
      web:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  pgdata:
  media:
  images:
  # guacd writes there and the web container serves from it, so a recorded
  # desktop is downloadable without either container owning the file.
  rdp-recordings:
