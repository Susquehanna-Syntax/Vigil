# Resolved dependency set — the exact versions a build should install.
#
# requirements.txt states policy (Django on the LTS line, cryptography kept
# current because it encrypts secrets at rest) as version ranges, so `pip
# install` resolved to "latest that fits" and two operators building the same
# commit a month apart shipped different software, with no lockfile to diff
# after an incident.
#
# This file is that diff. requirements.txt remains the place to change what
# Vigil depends on; regenerate here afterwards:
#
#     cd server && .venv/bin/pip freeze > requirements.lock
#
# The Dockerfile installs from requirements.txt and applies this as a
# constraints file, so the ranges still express intent and the build still
# gets one answer.
