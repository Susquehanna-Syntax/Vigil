name: Start a service
description: |
  Start one stopped service. For the services you expect to be there but not
  always running - a build daemon, a queue worker, a backup agent.
risk: standard
author: Vigil
created: 2026-10-12
inputs:
  - id: service
    type: text
    label: Service
    default: nginx
    required: true
actions:
  - id: start
    type: start_service
    params:
      service_name: "${{ inputs.service }}"
