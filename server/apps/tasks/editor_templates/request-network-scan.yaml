# Request a network scan of this host, whichever scanner you have
#
# What this does: queues a network scan against this host, and lets you pick
# - or not pick - which central scanner runs it.
#
# When to use it: when you have Nessus, Greenbone, or both, and want the scan
# done without caring which one does it.
#
# What to change: the engine choice, or leave it on the server's default.
#
# This is the engine-agnostic version of the Nessus request template: the same
# marker mechanism (the agent reports, the server records, the central scanner
# scans), with one input that says who should do it. Leaving it on "Server's
# default" lets Vigil choose from what is configured, consulting the host's
# preferred scanners when it has opinions.
#
# Nothing runs on the host, so this is low risk and safe to deploy to a large
# tag of machines at once - which is the usual way to ask "scan everything we
# have not looked at this month".

name: Request network scan
description: |
  Asks the server to queue a network scan against this host. The engine field
  picks which central scanner runs it, or leave it on the default and let the
  server choose from what is configured.
risk: low

inputs:
  - id: engine
    label: Scanner engine
    type: choice
    default: auto
    choices:
      - { value: auto, label: "Server's default" }
      - { value: nessus, label: "Nessus" }
      - { value: greenbone, label: "Greenbone" }

actions:
  - id: request_scan
    type: request_network_scan
    params:
      engine: "${{ inputs.engine }}"
