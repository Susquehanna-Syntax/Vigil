# A template playbook: clean up a container host.
#
# This is a Vigil playbook in the community YAML format, written by hand and
# kept with the server as an example. The Playbooks page's Templates button
# copies one into your library so you can open it, change it, and run it.
#
# What a playbook is, in one paragraph: a sequence of tasks that run one after
# another on the same host. Each step names a task by its slug - the task's
# name, lowercased with non-alphanumerics turned into hyphens - so a step here
# refers to a task in the library rather than repeating its YAML. Everything
# else a step can carry is optional: an id, per-step inputs, on_failure,
# on_not_applicable, a colour, an outcome label.

name: Clean up a container host
description: |
  Measures what Docker is using, then prunes the dangling images and the
  networks no container is attached to. Read the first step's output before you
  run the other two: that is the space you get back.

  What this one shows you about playbooks: the plain shape - ordered steps, no
  branches, nothing to fill in - and how a read-only task makes a useful first
  step in front of two that change things.
author: Vigil
created: 2026-10-12

steps:
  # Read-only, and the numbers a person wants before they delete anything.
  - task: measure-container-storage
    order: 1
    outcome: Measured

  - task: prune-dangling-images
    order: 2
    outcome: Images pruned

  - task: prune-unused-networks
    order: 3
    outcome: Networks pruned
