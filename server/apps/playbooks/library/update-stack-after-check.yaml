# A template playbook: check a stack's images, then update the stack.
#
# This is a Vigil playbook in the community YAML format, written by hand and
# kept with the server as an example. The Playbooks page's Templates button
# copies one into your library so you can open it, change it, and run it.
#
# What a playbook is, in one paragraph: a sequence of tasks that run one after
# another on the same host. Each step names a task by its slug - the task's
# name, lowercased with non-alphanumerics turned into hyphens - so a step here
# refers to a task in the library rather than repeating its YAML.

name: Update a stack after checking it
description: |
  Force a digest re-check of the images the host's containers run, then pull
  and recreate the compose stack you name at dispatch.

  What this one shows you about playbooks: a playbook input reaching a step
  whose task calls the same thing by a different name. The playbook asks for
  `stack`; the task "Update stack" calls it `project`, and the step's `inputs`
  mapping is where one becomes the other. It also shows the two-step shape you
  will write most often: a read-only question, then the change that follows
  from it.
author: Vigil
created: 2026-10-12

inputs:
  - id: stack
    type: text
    label: Stack
    description: The compose project to update, for example vigil
    required: true

steps:
  - task: check-docker-images-for-updates
    order: 1
    outcome: Checked

  # The playbook's `stack`, handed to the task's `project` input.
  - task: update-stack
    order: 2
    inputs:
      project: "${{ inputs.stack }}"
    outcome: Updated
