text
lang en_US.UTF-8
keyboard us
timezone America/New_York --utc
network --bootproto=dhcp --hostname=web-01
rootpw --lock
user --name=vigil --groups=wheel --iscrypted --password=*
sshkey --username=vigil "ssh-ed25519 AAAAC3Nz test"
ignoredisk --only-use=/dev/sda
clearpart --all --initlabel --drives=/dev/sda
autopart --type=lvm --fstype=ext4
bootloader --location=mbr
firstboot --disabled
reboot

%packages
@^minimal-environment
openssh-server
curl
vim
%end

%post --log=/root/vigil-enrol.log
curl -fsSL https://vigil.example.com/agent/install.sh -o /tmp/vigil-install.sh && VIGIL_ENROLL_TOKEN=enroll-token-fixture sh /tmp/vigil-install.sh && rm -f /tmp/vigil-install.sh
%end
