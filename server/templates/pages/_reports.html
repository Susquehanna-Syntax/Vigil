{% load static %}
<section class="page" id="page-reports">
  <div class="page-header">
    <div>
      <div class="page-title">Saved <span>Reports</span></div>
      <div class="page-sub">Charts over your playbook and automation runs: success rate, runs per day, failures by step and more.</div>
    </div>
  </div>

  <div id="rpt-panel">
    <div class="bl-toolbar" id="rpt-toolbar">
      <input type="text" class="form-control bl-search" id="rpt-search" placeholder="Search reports…">
      <button class="btn btn-mint" id="rpt-new-btn">New report</button>
    </div>
    <div id="rpt-list" class="bl-list"></div>
    <div id="rpt-view" hidden></div>
  </div>
</section>

<!-- ── Report builder modal ──────────────────────────────────────────── -->
<div class="modal-overlay" id="rpt-editor-overlay"></div>
<div class="modal modal-wide" id="rpt-editor-modal" data-editing="">
  <div class="modal-title">
    <span id="rpt-editor-title">New report</span>
    <button class="modal-close" id="rpt-cancel-btn" aria-label="Close">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="bl-field">
    <label for="rpt-name">Name</label>
    <input type="text" class="form-control" id="rpt-name" maxlength="120">
  </div>
  <div class="bl-field">
    <label for="rpt-description">Description</label>
    <textarea class="form-control" id="rpt-description" rows="2"></textarea>
  </div>
  <div class="bl-field">
    <label for="rpt-range">Range</label>
    <select class="form-control" id="rpt-range"></select>
  </div>
  <div class="bl-field">
    <label for="rpt-pb-filter">Playbooks</label>
    <input type="text" class="form-control" id="rpt-pb-filter" placeholder="Filter playbooks…">
    <div class="rpt-picks" id="rpt-pb-picks"></div>
  </div>
  <div class="bl-field">
    <label for="rpt-auto-filter">Automations</label>
    <input type="text" class="form-control" id="rpt-auto-filter" placeholder="Filter automations…">
    <div class="rpt-picks" id="rpt-auto-picks"></div>
  </div>
  <div class="bl-field">
    <label for="rpt-widget-add">Charts</label>
    <div class="rpt-widgets" id="rpt-widgets"></div>
    <select class="form-control" id="rpt-widget-add"></select>
  </div>
  <div class="modal-actions">
    <button class="btn btn-outline" id="rpt-cancel-btn-2" type="button">Cancel</button>
    <button class="btn btn-mint" id="rpt-save-btn">Save report</button>
  </div>
</div>

<script src="{% static 'js/vigil-reports.js' %}" defer></script>
