# Weekly dependency bumps as pull requests. Minor and patch bumps of each
# ecosystem arrive as one grouped PR; a major bump gets its own. Security
# updates come as soon as an advisory lands, whatever the schedule.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/server", "/agent", "/relay"]
    schedule: { interval: weekly, day: monday }
    groups:
      python-minor:
        update-types: [minor, patch]
    ignore:
      # Held back by what depends on them: django-celery-beat pins
      # cron-descriptor below 2, and celery pins python-dateutil below 3.
      - dependency-name: cron-descriptor
        versions: [">=2"]
      - dependency-name: python-dateutil
        versions: [">=3"]

  - package-ecosystem: docker
    directories: ["/server", "/relay"]
    schedule: { interval: weekly, day: monday }
    ignore:
      # The Business wheels are compiled for Python 3.12; the base image moves
      # only with them.
      - dependency-name: python
        versions: [">=3.13"]

  # The published compose pins every image to an exact tag (sprint M3 phase 2),
  # so a new TimescaleDB, Redis, guacd or cloudflared release arrives here.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
