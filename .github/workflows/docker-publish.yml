name: Build & Publish

on:
  push:
    # Every branch push builds an experimental image (ex-latest); see publish.
    # Dependabot's branches are tested through their pull requests instead.
    branches: ["**", "!dependabot/**"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

# A newer push to the same branch or pull request supersedes an older run;
# a version tag's run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  SERVER_IMAGE: susquehannasyntax/vigil
  RELAY_IMAGE: susquehannasyntax/vigil-relay
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Django checks ───────────────────────────────────────────────────────────
  test:
    name: Django Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: timescale/timescaledb:2.31.0-pg16
        env:
          POSTGRES_DB: vigil_test
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: vigil
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vigil"
          --health-interval=5s
          --health-retries=10
      redis:
        image: redis:7.4.12-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-retries=10

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "true"
      # Django's test runner forces DEBUG=False, so signing.py's
      # ephemeral-key fallback never fires under `manage.py test`. Tests
      # that sign tasks need a real seed — provide a throwaway one here
      # (32 random bytes, base64). CI-only value, never a deployed key.
      VIGIL_SIGNING_KEY_SEED: "rVVG5N5frRQYzPFzKradn0wIPW6+elhaDwPLUafvCNA="
      POSTGRES_DB: vigil_test
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_HOST: localhost
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      # The Business apps (private Vigil_Business repo), compiled, at the
      # version business.lock names, so the suite covers core with Business.
      # Pull requests from forks get no secrets and test the AGPL core alone;
      # its Business-dependent tests skip themselves.
      # Only these two steps ever see the token: never the job's environment,
      # where every dependency's install scripts and the test run could read it.
      - name: Is the Business token available
        id: business
        env:
          TOKEN: ${{ secrets.BUSINESS_REPO_TOKEN }}
        run: echo "available=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install the Business apps
        if: steps.business.outputs.available == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.BUSINESS_REPO_TOKEN }}
        run: |
          version="$(cat business.lock)"
          gh release download "v${version}" -R Susquehanna-Syntax/Vigil_Business \
            -p '*.whl' -D business-wheels
          pip install --no-deps --no-index --find-links business-wheels "vigil-business==${version}"
      - name: Django system check
        run: python manage.py check
      - name: Run migrations
        run: python manage.py migrate --noinput
      # Coverage is a CI-only tool, pinned here rather than in requirements.txt:
      # the app never imports it. The per-app table lands on the run's summary
      # page (sprint M2 phase 6); it is visible, never a gate.
      - name: Install coverage
        run: pip install coverage==7.6.1
      - name: Run tests
        run: |
          set -o pipefail
          python -m coverage run --source=apps,vigil manage.py test --verbosity=2 2>&1 | tee ../test-output.log
      - name: Name the failing tests
        if: failure()
        working-directory: .
        run: |
          grep -E -A 30 '^(FAIL|ERROR):' test-output.log | head -400 > test-failures.log || true
          scripts/ci-annotate.sh "Failing tests" 400 test-failures.log
      - name: Coverage by app
        if: always()
        run: |
          python -m coverage json -q -o coverage.json || exit 0
          python ../scripts/coverage-by-app.py coverage.json >> "$GITHUB_STEP_SUMMARY"
      # The relay container (2026.15.0) is its own package; aiohttp is already
      # in the server requirements because the dashboard's link uses it too.
      - name: Run relay tests
        working-directory: relay
        run: python -m unittest discover -s tests -t . -v

  # ── JavaScript unit tests ──────────────────────────────────────────────────
  # The dashboard's scripts are plain globals with no bundler, so the tests load
  # them into a Node vm context (server/jstests/harness.mjs) and run on the
  # built-in node:test runner: no npm install, no dependency to pin.
  js-tests:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run node:test
        working-directory: server
        run: node --test jstests/

  # ── Known-vulnerable dependencies ──────────────────────────────────────────
  # Every pinned Python dependency the images and the agent binaries ship, checked against
  # the PyPA and OSV advisory databases. The locks are exact pins, so nothing is
  # resolved: --no-deps --disable-pip audits exactly what a build installs. An
  # advisory with no fix yet fails the run too; ignore one only with
  # --ignore-vuln <id> and a comment saying why it does not reach Vigil.
  pip-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The images and the agent build run 3.12; resolve on the same Python, so
      # the lock is checked against what they actually install.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Each requirements.txt applies its lock (-c requirements-lock.txt), so a
      # package the lock does not name would be installed unpinned and never
      # audited. Install each component the way its build does and check.
      - name: Every installed package is in its lock
        run: |
          check() {  # <component> <extra packages its build installs>
            python -m venv "/tmp/lock-$1"
            "/tmp/lock-$1/bin/pip" install -q -r "$1/requirements.txt" $2
            "/tmp/lock-$1/bin/python" scripts/check-lock.py "$1/requirements-lock.txt"
          }
          check server ""
          check agent pyinstaller
          check relay ""
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.9.0
      - name: Audit
        run: |
          status=0
          for f in server/requirements-lock.txt agent/requirements-lock.txt relay/requirements-lock.txt; do
            echo "== $f"
            pip-audit -r "$f" --no-deps --disable-pip --progress-spinner off || status=1
          done
          exit $status

  # ── Browser end-to-end ─────────────────────────────────────────────────────
  # A real browser against a server started the way production starts
  # (DEBUG=false: the real CSP header, the cached template loader), on
  # Postgres. scripts/e2e/seed.py builds the fixture, scripts/e2e/run.py drives
  # sign-in with TOTP, every page under the CSP, host approval, a task deploy
  # and the site-scoped view. Screenshots are kept as an artifact either way.
  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.31.0-pg16
        env:
          POSTGRES_DB: vigil_e2e
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: vigil
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vigil"
          --health-interval=5s
          --health-retries=10
    env:
      DJANGO_SECRET_KEY: ci-e2e-secret-key-not-a-real-one-0123456789
      DJANGO_DEBUG: "false"
      VIGIL_PUBLIC_URL: http://localhost:8010
      VIGIL_SIGNING_KEY_SEED: "rVVG5N5frRQYzPFzKradn0wIPW6+elhaDwPLUafvCNA="
      POSTGRES_DB: vigil_e2e
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_HOST: localhost
      E2E_BASE: http://localhost:8010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Is the Business token available
        id: business
        env:
          TOKEN: ${{ secrets.BUSINESS_REPO_TOKEN }}
        run: echo "available=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # The token is given to this download step only, never to a step that
      # runs pip, the server or the browser.
      - name: Download the Business wheel
        if: steps.business.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUSINESS_REPO_TOKEN }}
        run: |
          gh release download "v$(cat business.lock)" -R Susquehanna-Syntax/Vigil_Business \
            -p '*.whl' -D business-wheels
      - name: Install
        env:
          BUSINESS: ${{ steps.business.outputs.available }}
        run: |
          pip install -q -r server/requirements.txt playwright==1.63.0
          if [ "$BUSINESS" = true ]; then
            pip install -q --no-deps --no-index --find-links business-wheels "vigil-business==$(cat business.lock)"
          fi
          python -m playwright install --with-deps chromium
      - name: Build and seed the database
        working-directory: server
        run: |
          python manage.py migrate --noinput
          python manage.py shell < ../scripts/e2e/seed.py
      - name: Start the server
        working-directory: server
        run: |
          python manage.py runserver localhost:8010 --insecure --noreload > ../e2e-server.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf "$E2E_BASE/api/v1/health/" && break; sleep 2; done
          curl -sf "$E2E_BASE/api/v1/health/" || { cat ../e2e-server.log; exit 1; }
      - name: Run the browser suite
        run: |
          set -o pipefail
          python scripts/e2e/run.py e2e-screens 2>&1 | tee e2e-run.log
      - name: Say why the browser suite failed
        if: failure()
        run: scripts/ci-annotate.sh "Browser end-to-end" 80 e2e-run.log e2e-server.log
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: |
            e2e-screens
            e2e-server.log
          retention-days: 14

  # ── Real agents on real operating systems ─────────────────────────────────
  # scripts/agent-e2e.py starts an agent, then acts as an operator through the
  # API (password + TOTP): the agent registers, is approved, checks in, is
  # sent a signed task, verifies it and reports the result. On Linux the agent
  # runs as root in stock Debian, Rocky and Ubuntu images on the runner's
  # network (scripts/agent-in-container.sh); on macOS and Windows it runs on
  # the runner itself, as root / Administrator. The server is this commit on
  # SQLite: these jobs test the agent's path, the test job tests Postgres.
  # New in sprint M2 and not yet required by publish: they become required
  # once they have been green on a pull request.
  agents:
    name: Agent end-to-end — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-12, os: ubuntu-latest, image: "debian:12" }
          - { name: rocky-9, os: ubuntu-latest, image: "rockylinux:9" }
          - { name: ubuntu-24.04, os: ubuntu-latest, image: "ubuntu:24.04" }
          - { name: macos, os: macos-latest }
          - { name: windows, os: windows-latest }
    env:
      USE_SQLITE: "1"
      DJANGO_SECRET_KEY: ci-agent-e2e-secret-key-not-a-real-one-0123
      DJANGO_DEBUG: "false"
      VIGIL_PUBLIC_URL: http://127.0.0.1:8010
      VIGIL_SIGNING_KEY_SEED: "rVVG5N5frRQYzPFzKradn0wIPW6+elhaDwPLUafvCNA="
      # A next key on offer, so the Linux rows also rotate (sprint M3 phase 3):
      # the agent acknowledges it, the key switches, and a second task signed
      # by the new key must still run. Test-only seeds, like the one above.
      VIGIL_SIGNING_KEY_NEXT_SEED: "0vZ5mXc9PqL3tWb8hYk2nRf6sDj1aGe4uIo7xCz0VbM="
      VIGIL_SKIP_STARTUP_CHECKS: "1"
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start a seeded server
        working-directory: server
        run: |
          pip install -q -r requirements.txt
          python manage.py migrate --noinput
          # Not `shell < seed.py`: on Windows Django's shell ignores piped stdin
          # (it select()s on it), so the seed never ran and no admin existed.
          python manage.py shell -c "exec(open('../scripts/e2e/seed.py').read())"
          python manage.py runserver 127.0.0.1:8010 --insecure --noreload > ../server.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8010/api/v1/health/ && break; sleep 2; done
          curl -sf http://127.0.0.1:8010/api/v1/health/ || { cat ../server.log; exit 1; }
      - name: Agent in a ${{ matrix.image }} container, as root
        if: matrix.image
        env:
          AGENT_E2E_WORK: ${{ runner.temp }}/agent-e2e
        run: |
          python scripts/agent-e2e.py --server http://127.0.0.1:8010 --workdir "$AGENT_E2E_WORK" \
            --timeout 240 --agent "scripts/agent-in-container.sh ${{ matrix.image }}" \
            --rotate-cmd "python server/manage.py"
      - name: Agent on macOS, as root
        if: runner.os == 'macOS'
        run: |
          python -m venv agent-venv && agent-venv/bin/pip install -q -r agent/requirements.txt
          cd agent && sudo -E ../agent-venv/bin/python ../scripts/agent-e2e.py --server http://127.0.0.1:8010 \
            --workdir "${{ runner.temp }}/agent-e2e" --agent "../agent-venv/bin/python -m vigil_agent"
      - name: Agent on Windows, as Administrator
        if: runner.os == 'Windows'
        run: |
          python -m venv agent-venv && agent-venv/Scripts/pip install -q -r agent/requirements.txt
          set -o pipefail
          cd agent && ../agent-venv/Scripts/python ../scripts/agent-e2e.py --server http://127.0.0.1:8010 \
            --workdir "${{ runner.temp }}/agent-e2e" --agent "../agent-venv/Scripts/python -m vigil_agent" \
            2>&1 | tee ../agent-e2e.log
      - name: Server log
        if: failure()
        run: |
          tail -200 server.log
          scripts/ci-annotate.sh "Agent end-to-end" 80 agent-e2e.log server.log

  # ── The published compose file, from an empty .env ────────────────────────
  # Sprint M3's finish line: `docker compose up` with nothing configured gives
  # a working, secure instance. The image is built from this commit (Community:
  # no Business token is needed) and tagged as the compose file expects, then
  # the stack comes up with no .env at all. It must: generate all three secrets,
  # pass every healthcheck, serve the sign-in page, refuse the old default
  # database password, on a second boot keep the secrets it made, and restore
  # a backup into a brand-new install.
  # New in sprint M3 and not yet required by publish.
  compose-smoke:
    name: Compose from an empty .env
    runs-on: ubuntu-latest
    env:
      # Only the published file: docker-compose.override.yml is the local
      # development setup (source mounted, dev server, DEBUG on web), and
      # Compose merges it in automatically when it sits beside this one.
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Build the image the compose file names
        run: |
          version="$(sed -n 's/^VIGIL_VERSION = "\(.*\)"$/\1/p' server/vigil/settings.py)"
          docker build -f server/Dockerfile -t susquehannasyntax/vigil:latest \
            -t "susquehannasyntax/vigil:${version}" .
      - name: First boot, nothing configured
        run: |
          test ! -e .env
          docker compose up -d
          scripts/compose-wait-healthy.sh 300
          docker compose logs secrets | tee secrets-first.log
          for name in django_secret_key signing_key_seed postgres_password; do
            grep -q "${name}: generated" secrets-first.log
          done
      - name: It serves, and the old default password is gone
        run: |
          code() { curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' "$1"; }
          curl -sf http://localhost:9200/api/v1/health/ \
            || { echo "::error title=Compose::health answered $(code http://localhost:9200/api/v1/health/)"; exit 1; }
          curl -sf -o /dev/null http://localhost:9200/login/ \
            || { echo "::error title=Compose::login answered $(code http://localhost:9200/login/)"; exit 1; }
          # The nightly backup's pg_dump must match the pinned pg16 server.
          v="$(docker compose exec -T celery-worker pg_dump --version 2>&1)"
          echo "$v" | grep -E ' 16\.' || { echo "::error title=Compose::pg_dump is: $v"; exit 1; }
          # A missing psql would make the refusal below look like a pass.
          docker compose exec -T celery-worker psql --version
          # Over the compose network, as the app connects: inside the db
          # container the image trusts 127.0.0.1, so any password works there.
          if docker compose exec -T celery-worker env PGPASSWORD=vigil \
              psql -h db -U vigil -d vigil -c 'select 1' >/dev/null 2>&1; then
            echo "::error title=Compose::the database still accepts the password 'vigil'"; exit 1
          fi
      - name: Second boot keeps the secrets
        run: |
          docker compose down
          docker compose up -d
          scripts/compose-wait-healthy.sh 300
          docker compose logs secrets | tail -3 | tee secrets-second.log
          test "$(grep -c ': kept' secrets-second.log)" = 3
          curl -sf http://localhost:9200/api/v1/health/
      # Sprint M3's other finish line: a restore of a backup passes. Back up,
      # destroy every volume, start a brand-new install (new secrets), restore
      # into it, and the data and the signing key are the old ones again.
      - name: Back up, wipe everything, restore into a new install
        run: |
          shell() { docker compose exec -T "$1" python manage.py shell -c "$2" | tail -1; }
          shell web "from django.contrib.auth import get_user_model; get_user_model().objects.create_user('restore-marker', password='x'); print('made')"
          key_before=$(shell web "from vigil.signing import get_public_key_b64; print(get_public_key_b64())")
          shell celery-worker "from apps.instance.backup import run_backup; r = run_backup(); print(r.state, r.error)" | tee backup.out
          grep -q '^ok' backup.out
          archive=$(docker compose exec -T celery-worker sh -c 'ls /var/lib/vigil/backups/vigil-*.tar.gz' | tail -1 | tr -d '\r')
          docker compose cp "celery-worker:${archive}" ./backup.tar.gz

          docker compose down -v
          docker compose up -d
          scripts/compose-wait-healthy.sh 300
          key_fresh=$(shell web "from vigil.signing import get_public_key_b64; print(get_public_key_b64())")
          test "$key_fresh" != "$key_before"

          docker compose stop web celery-worker celery-beat link
          project=$(docker compose config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')
          docker compose run --rm --no-deps --entrypoint "" \
            -e VIGIL_SECRETS_DIR=/restore-secrets -v "${project}_secrets:/restore-secrets" \
            -v "$PWD/backup.tar.gz:/tmp/backup.tar.gz:ro" \
            web python manage.py restore_backup /tmp/backup.tar.gz --yes
          docker compose up -d
          scripts/compose-wait-healthy.sh 300

          test "$(shell web "from django.contrib.auth import get_user_model; print(get_user_model().objects.filter(username='restore-marker').count())")" = 1
          test "$(shell web "from vigil.signing import get_public_key_b64; print(get_public_key_b64())")" = "$key_before"
          curl -sf http://localhost:9200/api/v1/health/
      - name: Logs
        if: failure()
        run: docker compose logs --tail 200
      - name: Say why the stack did not come up
        if: failure()
        run: |
          docker compose ps -a > stack-ps.log 2>&1 || true
          # Each service's own tail: one chatty container (web's migrations)
          # must not push a crashing one's error out of view.
          for svc in $(docker compose config --services); do
            docker compose logs --no-color --tail 12 "$svc" > "compose-$svc.log" 2>&1 || true
          done
          scripts/ci-annotate.sh "Compose" 200 stack-ps.log compose-*.log

  # ── Free security scans ────────────────────────────────────────────────────
  # The stand-in for a paid penetration test until there is budget for one
  # (sprint M3): Semgrep's Python, Django and JavaScript rules over the source,
  # then an OWASP ZAP baseline scan of a running install from an empty .env.
  # Excluded Semgrep rules, each triaged on 2026-11-12: insecure-file-permissions
  # flags every chmod, and ours only tighten (0o700); the Flask, React and
  # Express rules fire on code that uses none of them (escHtml/escAttr guard the
  # HTML, get_host() enforces ALLOWED_HOSTS); django-no-csrf-token misreads
  # setup.html, which has the token. Single findings carry a nosemgrep comment
  # with the reason. Not yet a publish gate: it becomes required once the ZAP
  # baseline has been triaged as well.
  security-scan:
    name: Security scans (Semgrep, ZAP baseline)
    runs-on: ubuntu-latest
    env:
      # Only the published file: docker-compose.override.yml is the local
      # development setup (source mounted, dev server, DEBUG on web), and
      # Compose merges it in automatically when it sits beside this one.
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Semgrep
        run: |
          pip install semgrep==1.95.0 "setuptools<81"
          semgrep scan --metrics=off --config p/python --config p/django \
            --config p/javascript --exclude '*/migrations/*' --exclude '*/tests/*' \
            --exclude 'test_*.py' \
            --exclude-rule python.lang.security.audit.insecure-file-permissions.insecure-file-permissions \
            --exclude-rule python.flask.security.audit.directly-returned-format-string.directly-returned-format-string \
            --exclude-rule typescript.react.security.audit.react-unsanitized-method.react-unsanitized-method \
            --exclude-rule javascript.express.security.injection.raw-html-format.raw-html-format \
            --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token \
            --error server agent
      - name: Start an install from an empty .env
        if: always()
        run: |
          version="$(sed -n 's/^VIGIL_VERSION = "\(.*\)"$/\1/p' server/vigil/settings.py)"
          docker build -f server/Dockerfile -t susquehannasyntax/vigil:latest \
            -t "susquehannasyntax/vigil:${version}" .
          docker compose up -d
          scripts/compose-wait-healthy.sh 300
      - name: ZAP baseline
        if: always()
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk" \
            zaproxy/zaproxy:2.16.1 zap-baseline.py \
            -t http://localhost:9200/login/ -r zap-report.html -J zap-report.json -I
      - name: Summarise the ZAP findings
        if: always()
        run: |
          python3 - <<'PY' > zap-summary.log || true
          import json
          report = json.load(open("zap/zap-report.json"))
          for site in report.get("site", []):
              for a in site.get("alerts", []):
                  urls = sorted({i.get("uri", "") for i in a.get("instances", [])})[:3]
                  print(f"{a.get('riskdesc')} | {a.get('pluginid')} {a.get('name')} | "
                        f"{a.get('count')} x | {' '.join(urls)}")
          PY
          scripts/ci-annotate.sh "ZAP" 60 zap-summary.log
      - name: Keep the ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/
          retention-days: 30
      - name: Say why the stack did not come up
        if: failure()
        run: |
          docker compose ps -a > stack-ps.log 2>&1 || true
          # Each service's own tail: one chatty container (web's migrations)
          # must not push a crashing one's error out of view.
          for svc in $(docker compose config --services); do
            docker compose logs --no-color --tail 12 "$svc" > "compose-$svc.log" 2>&1 || true
          done
          scripts/ci-annotate.sh "Compose" 200 stack-ps.log compose-*.log

  # ── Upgrade from the previous release ─────────────────────────────────────
  # Migrations that only ever ran on an empty database are how upgrades break.
  # This job builds the previous release's schema with that release's own code
  # (and its own Business version), seeds it the way an install looks
  # (scripts/upgrade-seed.py), migrates with this commit, checks that every
  # row came through and reads the way the upgrade notes say
  # (scripts/upgrade-verify.py), then starts the app.
  upgrade:
    name: Upgrade from the previous release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.31.0-pg16
        env:
          POSTGRES_DB: vigil_upgrade
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: vigil
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vigil"
          --health-interval=5s
          --health-retries=10
    env:
      DJANGO_SECRET_KEY: ci-upgrade-secret-key
      DJANGO_DEBUG: "true"
      VIGIL_SIGNING_KEY_SEED: "rVVG5N5frRQYzPFzKradn0wIPW6+elhaDwPLUafvCNA="
      POSTGRES_DB: vigil_upgrade
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_HOST: localhost
      VIGIL_SKIP_STARTUP_CHECKS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find the previous release
        id: prev
        run: |
          # The newest release tag before this commit (a release's own tag
          # build compares against the one before it).
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Upgrading from ${tag}"
          git worktree add ../previous "${tag}"
      - name: Is the Business token available
        id: business
        env:
          TOKEN: ${{ secrets.BUSINESS_REPO_TOKEN }}
        run: echo "available=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Only the two download steps ever see the token, as in the test job:
      # never a step that runs pip, migrations or the app.
      - name: Download the previous release's Business wheel
        if: steps.business.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUSINESS_REPO_TOKEN }}
        run: |
          version="$(cat ../previous/business.lock)"
          gh release download "v${version}" -R Susquehanna-Syntax/Vigil_Business -p '*.whl' -D ../old-wheels
      - name: Download this commit's Business wheel
        if: steps.business.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUSINESS_REPO_TOKEN }}
        run: |
          version="$(cat business.lock)"
          gh release download "v${version}" -R Susquehanna-Syntax/Vigil_Business -p '*.whl' -D business-wheels
      - name: Build the previous release's database
        env:
          BUSINESS: ${{ steps.business.outputs.available }}
        run: |
          python -m venv ../old-venv
          ../old-venv/bin/pip install -q -r ../previous/server/requirements.txt
          if [ "$BUSINESS" = true ]; then
            ../old-venv/bin/pip install -q --no-deps --no-index --find-links ../old-wheels \
              "vigil-business==$(cat ../previous/business.lock)"
          fi
          cd ../previous/server
          ../../old-venv/bin/python manage.py migrate --noinput
          ../../old-venv/bin/python manage.py shell < "$GITHUB_WORKSPACE/scripts/upgrade-seed.py"
      - name: Migrate with this commit
        env:
          BUSINESS: ${{ steps.business.outputs.available }}
        run: |
          pip install -q -r server/requirements.txt
          if [ "$BUSINESS" = true ]; then
            pip install -q --no-deps --no-index --find-links business-wheels "vigil-business==$(cat business.lock)"
          fi
          cd server
          python manage.py migrate --noinput
          python manage.py check
      - name: Every row came through
        working-directory: server
        run: python manage.py shell < ../scripts/upgrade-verify.py
      - name: The upgraded app starts and answers
        working-directory: server
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > ../runserver.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health/ && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/v1/health/ || { cat ../runserver.log; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/login/)" = 200

  # ── Build agent binaries (parallel) ─────────────────────────────────────────
  # macOS is Apple Silicon only (2026.15): macos-latest is arm64, so the agent
  # builds natively there. Intel Macs are no longer a target.
  # Linux binaries build natively on amd64 and arm64 runners — PyInstaller
  # cannot cross-compile between Linux architectures.
  build-agent:
    name: Agent — ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            out: vigil-agent-linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            out: vigil-agent-linux-arm64
          - os: macos-latest
            platform: darwin-arm64
            out: vigil-agent-darwin-arm64
          - os: windows-latest
            platform: windows-amd64
            out: vigil-agent-windows-amd64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No pip cache: actions/setup-python@v5's internal cache step has been
      # failing on windows-latest after the Windows Server 2025 rollout, and
      # it marks the whole step failed even when Python installs cleanly.
      # The agent has 4 small deps — fresh install takes seconds.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        # requirements.txt, like the other platforms: a hand-picked list here
        # once left out websocket-client, which live sessions need.
        run: pip install -r requirements.txt pyinstaller
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: pip install -r requirements.txt pyinstaller
      - name: Build binary (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller --onefile --target-arch arm64 --name ${{ matrix.out }} --collect-all cffi --collect-all nacl vigil_agent_main.py
      # --onedir, not --onefile, and this is not a preference. A --onefile
      # build cannot host a Windows service: its bootloader extracts and
      # re-executes, so the process the SCM is watching never calls
      # StartServiceCtrlDispatcher and Start-Service fails with
      #
      #   [SC] StartService FAILED 1053
      #
      # Proved by building the same source both ways on a Windows 11 VM:
      # --onedir reaches STATE: 4 RUNNING, --onefile times out every time.
      #
      # The pywin32 service modules are imported inside a try/except in
      # vigil_agent/winservice.py, so PyInstaller's static analysis does not
      # find them and the frozen build silently lacks them — --service then
      # reports pywin32 missing and the service cannot start.
      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: >-
          pyinstaller --onedir --name ${{ matrix.out }}
          --collect-all cffi --collect-all nacl
          --hidden-import win32serviceutil --hidden-import win32service
          --hidden-import win32event --hidden-import servicemanager
          --hidden-import win32timezone
          vigil_agent_main.py
      # Authenticode signing, when a certificate is configured. Skipped
      # cleanly when it is not, so the build works in a fork or before a
      # certificate exists — an unsigned agent runs, it just meets SmartScreen
      # on an interactive download and can trip WDAC/AppLocker policies that
      # refuse unsigned executables. Defender does not currently flag the
      # build (scanned clean with real-time protection on), but PyInstaller
      # output is a routine false positive and a signature is what stops a
      # definition update becoming an outage.
      #
      # Set WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD to enable.
      - name: Sign the Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_B64) {
            Write-Host "::notice::No signing certificate configured; shipping an unsigned agent."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "vigil-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          try {
            $exe = "dist/${{ matrix.out }}/${{ matrix.out }}.exe"
            $signtool = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                        Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
            if (-not $signtool) { Write-Host "::error::signtool.exe not found on the runner"; exit 1 }
            & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::signing failed"; exit 1 }
            # Verify rather than trust the exit code.
            $sig = Get-AuthenticodeSignature $exe
            Write-Host ("signature status: " + $sig.Status)
            if ($sig.Status -ne "Valid") { Write-Host "::error::signature did not verify"; exit 1 }
          } finally {
            Remove-Item -Force $pfx -ErrorAction SilentlyContinue
          }

      # Ship the directory as one file so the download endpoint and the
      # digest check stay unchanged — the installer sniffs the zip magic and
      # expands it. Signing happens first, so the digest covers the signed
      # binary rather than an unsigned one.
      - name: Zip the Windows onedir build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/${{ matrix.out }}/*" -DestinationPath "dist/${{ matrix.out }}.zip" -Force
          Get-Item "dist/${{ matrix.out }}.zip" | ForEach-Object { Write-Host ("zip bytes: " + $_.Length) }
      # Build inside python:3.12-slim (Debian 12) rather than on the runner
      # directly — a binary linked against the runner's glibc 2.39 would not
      # start on Debian 11 / Ubuntu 20.04 era hosts. This matches the glibc
      # floor of the previous in-Dockerfile agent build.
      - name: Build binary (Linux, Debian 12 container)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD":/build -w /build python:3.12-slim bash -c "
            set -e
            apt-get update
            apt-get install -y --no-install-recommends binutils
            pip install --no-cache-dir -r requirements.txt pyinstaller
            pyinstaller --onefile --name ${{ matrix.out }} --collect-all cffi --collect-all nacl vigil_agent_main.py
          "
      # Windows ships the zip only. Uploading the unpacked onedir tree as well
      # would roughly double the artifact and land both in server/agent_dist,
      # where the zip is what the server serves anyway.
      - name: Upload artifact (Windows — zip only)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: agent/dist/${{ matrix.out }}.zip
          retention-days: 7

      - name: Upload artifact
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: agent/dist/${{ matrix.out }}*
          retention-days: 7

  # ── Install the macOS agent for real ───────────────────────────────────────
  # Building a binary proves it links. It does not prove the documented install
  # path works, and on 2026-09-11 that distinction cost us: install.sh read the
  # digest header with gawk's IGNORECASE, which mawk and macOS's one-true-awk
  # both ignore in silence, so the script refused every install on Debian,
  # Ubuntu AND macOS while the whole suite stayed green.
  #
  # macOS has no VM option here — Apple's licence limits virtualisation to
  # Apple hardware, and these runners are the only Apple Silicon we have. So
  # this job runs `curl | sudo bash` exactly as the docs tell a user to.
  smoke-macos-install:
    name: macOS — install.sh end to end
    runs-on: macos-latest          # Apple Silicon; darwin-arm64
    needs: [build-agent]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm this runner's awk lacks IGNORECASE
        # Not a formality. If this ever prints "gawk", the job has stopped
        # covering the case that broke, and the guard below is worthless.
        run: |
          awk -W version 2>&1 | head -1 || true
          printf 'X-Test: VALUE\n' \
            | awk 'BEGIN{IGNORECASE=1} /^x-test:/ {print "MATCHED"}' \
            | grep -q MATCHED \
            && { echo "::error::this runner's awk supports IGNORECASE; it no longer reproduces the mawk/BSD case"; exit 1; } \
            || echo "awk has no IGNORECASE, as expected"

      - name: Fetch the darwin-arm64 agent built by this run
        uses: actions/download-artifact@v4
        with:
          name: vigil-agent-darwin-arm64
          path: server/agent_dist

      - name: Normalise the binary name the server expects
        run: |
          cd server/agent_dist
          ls -la
          # PyInstaller may leave the name as-is; the server looks for exactly this.
          [ -f vigil-agent-darwin-arm64 ] || mv vigil-agent-darwin-arm64* vigil-agent-darwin-arm64
          chmod +x vigil-agent-darwin-arm64

      - name: Install server deps
        working-directory: server
        run: pip install -r requirements.txt

      - name: Start a throwaway Vigil server
        working-directory: server
        env:
          USE_SQLITE: "1"
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-macos-smoke-key
          VIGIL_PUBLIC_URL: http://127.0.0.1:8010
          VIGIL_SIGNING_KEY_SEED: "rVVG5N5frRQYzPFzKradn0wIPW6+elhaDwPLUafvCNA="
        run: |
          python manage.py migrate --noinput
          nohup python manage.py runserver 127.0.0.1:8010 --insecure --noreload \
            > /tmp/vigil-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8010/api/v1/health/ >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8010/api/v1/health/ || { cat /tmp/vigil-server.log; exit 1; }

      - name: The server must publish a digest for this binary
        run: |
          SHA=$(curl -sS -D- -o /dev/null http://127.0.0.1:8010/agent/download/darwin-arm64/ \
                | awk 'tolower($0) ~ /^x-vigil-sha256:/ {gsub(/\r/,"",$2); print tolower($2)}')
          echo "published: ${SHA:-<none>}"
          [ -n "$SHA" ] || { echo "::error::no X-Vigil-SHA256 header — install.sh will refuse"; exit 1; }
          LOCAL=$(shasum -a 256 server/agent_dist/vigil-agent-darwin-arm64 | awk '{print $1}')
          [ "$SHA" = "$LOCAL" ] || { echo "::error::published digest $SHA != actual $LOCAL"; exit 1; }

      - name: Run the documented install path
        run: |
          curl -fsSL http://127.0.0.1:8010/agent/install.sh | sudo bash

      - name: The install must have verified, not merely succeeded
        run: |
          test -x /usr/local/bin/vigil-agent \
            || { echo "::error::agent binary not installed"; exit 1; }
          PLIST=/Library/LaunchDaemons/com.susquehannasyntax.vigil-agent.plist
          test -f "$PLIST" || { echo "::error::launchd plist not written"; exit 1; }
          plutil -lint "$PLIST"
          INSTALLED=$(shasum -a 256 /usr/local/bin/vigil-agent | awk '{print $1}')
          LOCAL=$(shasum -a 256 server/agent_dist/vigil-agent-darwin-arm64 | awk '{print $1}')
          [ "$INSTALLED" = "$LOCAL" ] || { echo "::error::installed bytes differ from what was served"; exit 1; }
          sudo test -f /etc/vigil/agent.yml || { echo "::error::no config written"; exit 1; }

      - name: It must refuse a binary whose digest does not match
        # The half that matters. A check that never fires is not a check.
        run: |
          cat > /tmp/tamper.py <<'EOF'
          import http.server, socketserver
          BIN = "server/agent_dist/vigil-agent-darwin-arm64"
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = open(BIN, "rb").read()
                  self.send_response(200)
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("X-Vigil-SHA256", "deadbeef" * 8)
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a): pass
          socketserver.TCPServer.allow_reuse_address = True
          socketserver.TCPServer(("127.0.0.1", 8011), H).serve_forever()
          EOF
          sed -i '' 's/^          //' /tmp/tamper.py
          nohup python3 /tmp/tamper.py > /tmp/tamper.log 2>&1 &
          sleep 3
          curl -fsSL http://127.0.0.1:8010/agent/install.sh \
            | sed 's|http://127.0.0.1:8010|http://127.0.0.1:8011|g' > /tmp/tampered.sh
          if sudo bash /tmp/tampered.sh; then
            echo "::error::installer accepted a binary with a mismatched digest"
            exit 1
          fi
          echo "refused a tampered binary, as it should"

      - name: The agent must actually run
        run: |
          /usr/local/bin/vigil-agent --help
          sudo launchctl load /Library/LaunchDaemons/com.susquehannasyntax.vigil-agent.plist || true
          sleep 20
          python3 - <<'EOF'
          import json, urllib.request, sys
          # The agent self-registers; a host in the queue proves the whole
          # chain, from launchd through enrolment.
          with urllib.request.urlopen("http://127.0.0.1:8010/api/v1/health/") as r:
              print("server healthy:", r.status)
          EOF
          cd server && USE_SQLITE=1 DJANGO_SECRET_KEY=ci-macos-smoke-key \
            VIGIL_SIGNING_KEY_SEED="rVVG5N5frRQYzPFzKradn0wIPW6+elhaDwPLUafvCNA=" \
            python manage.py shell -c "
          from apps.hosts.models import Host
          hosts = list(Host.objects.all())
          print('registered hosts:', [(h.hostname, h.status, h.os) for h in hosts])
          assert hosts, 'the macOS agent never registered'
          "

      - name: Server log on failure
        if: failure()
        run: cat /tmp/vigil-server.log || true

  # ── Build and push Docker image (main branch + tags only) ──────────────────
  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [test, js-tests, e2e, upgrade, pip-audit, build-agent, smoke-macos-install]
    # What a push publishes, once every check above has passed:
    #   v2026.17.0       -> 2026.17.0 and latest        (production)
    #   v2026.17.0-rc1   -> 2026.17.0-rc1 and rc-latest (release candidate)
    #   v2026.17.0-ex1   -> 2026.17.0-ex1 and ex-latest (experimental)
    #   any branch push  -> ex-<commit> and ex-latest   (experimental)
    # Only a version tag can reach latest or rc-latest. Pull requests from
    # forks never publish: they are pull_request events, not pushes.
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/'))
    # Third-party actions in this job are pinned to commits, not tags: it holds
    # the Docker Hub token and can mint signing identities, so a moved tag
    # must not be able to change what runs here. Bump the hash with the tag.
    permissions:
      contents: read
      # Keyless cosign signing: the signature is tied to this workflow run
      # through GitHub's OIDC token, so there is no signing key to keep.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # The tag names the release: its version must be the one the code says it
      # is, and anything after it must be a release candidate or experimental
      # build, so a mistyped tag can never reach latest or a channel by accident.
      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(sed -n 's/^VIGIL_VERSION = "\(.*\)"$/\1/p' server/vigil/settings.py)"
          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|ex)[0-9]+)?$'; then
            echo "::error::Tag $tag is not vX.Y.Z, vX.Y.Z-rcN or vX.Y.Z-exN"; exit 1
          fi
          base="${tag#v}"; base="${base%%-*}"
          if [ "$base" != "$version" ]; then
            echo "::error::Tag $tag does not match VIGIL_VERSION $version in server/vigil/settings.py"; exit 1
          fi

      # Download all agent binaries into server/agent_dist/.
      # COPY server/ . in the Dockerfile picks them up automatically.
      - name: Download agent binaries
        uses: actions/download-artifact@v4
        with:
          path: server/agent_dist/
          merge-multiple: true

      # The compiled Business apps go into the image (server/Dockerfile).
      # Never publish an image without them: a missing release fails here.
      - name: Download the Business apps
        env:
          GH_TOKEN: ${{ secrets.BUSINESS_REPO_TOKEN }}
        run: |
          version="$(cat business.lock)"
          gh release download "v${version}" -R Susquehanna-Syntax/Vigil_Business \
            -p '*.whl' -D business-wheels
          ls business-wheels/*.whl

      - name: Mark Unix binaries executable
        run: |
          chmod +x server/agent_dist/vigil-agent-linux-amd64 || true
          chmod +x server/agent_dist/vigil-agent-linux-arm64 || true
          chmod +x server/agent_dist/vigil-agent-darwin-arm64 || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.SERVER_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            type=raw,value=rc-latest,enable=${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-rc') }}
            type=raw,value=ex-latest,enable=${{ startsWith(github.ref, 'refs/heads/') || contains(github.ref_name, '-ex') }}
            type=sha,prefix=ex-,format=short,enable=${{ startsWith(github.ref, 'refs/heads/') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          # An SBOM and a build provenance record, attached to the image in the
          # registry and signed with it below. Read them with
          #   docker buildx imagetools inspect <image> --format '{{ json .SBOM }}'
          sbom: true
          provenance: mode=max

      # The relay is small and has no agent builds in it: one more image from
      # the same commit, so a relay and the dashboard it links to match.
      - name: Extract relay metadata
        id: relaymeta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.RELAY_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            type=raw,value=rc-latest,enable=${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-rc') }}
            type=raw,value=ex-latest,enable=${{ startsWith(github.ref, 'refs/heads/') || contains(github.ref_name, '-ex') }}
            type=sha,prefix=ex-,format=short,enable=${{ startsWith(github.ref, 'refs/heads/') }}

      - name: Build and push relay
        id: buildrelay
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: relay
          file: relay/Dockerfile
          push: true
          tags: ${{ steps.relaymeta.outputs.tags }}
          labels: ${{ steps.relaymeta.outputs.labels }}
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay
          platforms: linux/amd64,linux/arm64
          # An SBOM and a build provenance record, attached to the image in the
          # registry and signed with it below. Read them with
          #   docker buildx imagetools inspect <image> --format '{{ json .SBOM }}'
          sbom: true
          provenance: mode=max

      # Sign both images by digest, so anyone can check that what they pulled
      # is what this workflow built (wiki: Deployment → Verify the image):
      #   cosign verify susquehannasyntax/vigil:<version> \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity-regexp '^https://github.com/Susquehanna-Syntax/Vigil/'
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign images
        env:
          SERVER_DIGEST: ${{ steps.build.outputs.digest }}
          RELAY_DIGEST: ${{ steps.buildrelay.outputs.digest }}
        run: |
          cosign sign --yes "${SERVER_IMAGE}@${SERVER_DIGEST}"
          cosign sign --yes "${RELAY_IMAGE}@${RELAY_DIGEST}"

  # ── Signed agent release files ─────────────────────────────────────────────
  # The free signing route (sprint M8): every version tag attaches the agent
  # binaries to its GitHub release with a SHA-256 checksum list and a Sigstore
  # bundle per file, signed keylessly by this workflow's identity. No
  # certificate to buy or keep. Check a download with:
  #   sha256sum -c SHA256SUMS --ignore-missing
  #   cosign verify-blob vigil-agent-linux-amd64 \
  #     --bundle vigil-agent-linux-amd64.sigstore.json \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  #     --certificate-identity-regexp '^https://github.com/Susquehanna-Syntax/Vigil/'
  release-files:
    name: Signed agent release files
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # create the release and upload to it
      id-token: write   # keyless Sigstore signing
    steps:
      - name: Download agent binaries
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Checksum and sign every file
        working-directory: release
        run: |
          ls -l
          sha256sum vigil-agent-* > SHA256SUMS
          cat SHA256SUMS
          for f in vigil-agent-* SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Attach to the release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A release candidate or experimental tag is a pre-release, so it
          # never shows as the latest release on GitHub.
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag $pre \
              --title "$TAG" --notes "Agent binaries, SHA256SUMS and Sigstore bundles for $TAG."
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            vigil-agent-* SHA256SUMS SHA256SUMS.sigstore.json
