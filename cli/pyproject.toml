[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-cli"
description = "Vigil from a terminal: hosts, alerts, tasks and deploys."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
dependencies = []
dynamic = ["version"]

[project.scripts]
vigil = "vigil_cli.main:main"

[tool.setuptools]
packages = ["vigil_cli"]

[tool.setuptools.dynamic]
version = { attr = "vigil_cli.__version__" }
