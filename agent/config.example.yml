# Vigil Agent Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Copy to /etc/vigil/agent.yml (Linux/macOS) or
#          C:\ProgramData\Vigil\agent.yml (Windows)
# Override path via: VIGIL_CONFIG_PATH=/path/to/agent.yml
#
# SECURITY: this file contains your agent token — chmod 600 on Linux/macOS.
# ─────────────────────────────────────────────────────────────────────────────


# ── Connection ────────────────────────────────────────────────────────────────

# URL of the Vigil server (no trailing slash).
server_url: https://vigil.example.com

# Agent token — generated automatically on first run and saved here.
# Copy the token from the Vigil console to pre-authorize this host.
# Leave empty to auto-register (host will appear as "Pending" until approved).
agent_token: ""

# Check-in interval in seconds. Lower values give fresher metrics and faster
# task dispatch at the cost of more server load. Default: 60.
checkin_interval: 60

# Seconds between Docker Hub image-update checks (unmetered HEAD requests —
# never counted pulls). Default: 21600 (6 hours), minimum 300. Docker-mutating
# tasks and the "Check Docker images for updates" template trigger an
# immediate re-check regardless of this interval.
docker_check_interval: 21600


# ── Agent Mode ────────────────────────────────────────────────────────────────
#
#   monitor      — collect and report metrics only; tasks are never executed
#   managed      — metrics + execute tasks that appear in the allowlist below
#   full_control — metrics + execute ANY action the server requests
#                  (opt-in only; requires explicit acknowledgement)
#
# The agent's mode is the final word. A compromised server cannot escalate
# an agent beyond its configured mode.
#
# One exception, and it is deliberate: reprovisioning (wiping and
# reinstalling this machine) is NOT included in full_control. It has its
# own flag below.

mode: managed


# ── Remote reprovisioning ─────────────────────────────────────────────────────
#
# Permit Vigil to remotely WIPE THIS MACHINE and reinstall its operating
# system, unattended, from an image chosen in the console.
#
# This is NOT implied by full_control, and it cannot be granted through the
# allowlist below. The authority to destroy a machine lives on that machine,
# so a compromised server cannot order a fleet to rebuild itself.
#
# Leave false unless you specifically want this host to be rebuildable.
# The read-only readiness probe (reprovision_preflight) is unaffected by
# this flag — allowlist it if you want to check rebuild-readiness without
# arming anything.

allow_reprovision: false


# ── Allowlist (managed mode only) ────────────────────────────────────────────
#
# Actions this agent will execute when mode is "managed".
# full_control and monitor modes ignore this list entirely.
# Each entry matches an action type in the task YAML.

allowlist:
  # Service / container lifecycle
  - restart_service
  - restart_container
  - stop_container
  - start_container

  # Container image updates (pull + recreate on the new image)
  - pull_image
  - recreate_container
  - check_docker_updates

  # Housekeeping
  - clear_temp_files
  - clear_docker_logs

  # Package management
  - run_package_updates
  - update_package
  - install_package

  # Vulnerability scanning — uncomment to let this host be scanned.
  # Without run_trivy_scan a managed agent rejects the scan task and the
  # Vulnerabilities tab stays empty for this host, with the rejection the
  # only clue. Trivy runs locally and reads the filesystem; the other two
  # only leave a marker asking the server to schedule a network scan.
  # - run_trivy_scan
  # - trivy_db_update
  # - request_network_scan
  # - request_nessus_scan

  # Firewall management — uncomment to let Vigil read and edit this host's
  # firewall. list_firewall_rules only reads; the rest change the firewall and
  # can take this host off the network.
  # - list_firewall_rules
  # - add_firewall_rule
  # - remove_firewall_rule
  # - set_firewall_policy
  # - enable_firewall
  # - disable_firewall

  # Higher-risk actions — uncomment deliberately:
  # - execute_script   # runs a pre-approved script from scripts_dir
  # - reboot           # full system reboot


# ── Storage ──────────────────────────────────────────────────────────────────

# Runtime state: nonce cache, pinned server public key, metric buffer.
data_dir: /var/lib/vigil-agent

# Pre-approved scripts for the execute_script action.
# Paths outside this directory are rejected by the agent.
scripts_dir: /etc/vigil/scripts


# ── Tags ─────────────────────────────────────────────────────────────────────
#
# Tags advertised to the server at every check-in.
# Operators can also assign tags from the Vigil console; both sources are
# merged (server-side values always win on conflict).
# Tags enable "deploy by tag" targeting — e.g. roll out a task to all "prod"
# hosts without listing them individually.

tags:
  - linux
  # - prod
  # - rack-3
  # - web-server
  # - site-london
